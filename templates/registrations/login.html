{% extends 'base.html' %}
{% block content %}

<div class="container mx-auto px-6 py-16 max-w-md">
    <div class="card p-8">
        <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn-primary w-full mt-4">
                Login
            </button>
        </form>
    </div>
</div>

{% endblock %}
